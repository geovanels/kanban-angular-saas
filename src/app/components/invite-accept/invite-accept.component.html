<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 pb-16">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <div *ngIf="company()?.brandingConfig?.logo" class="flex justify-center mb-4">
        <img [src]="company()!.brandingConfig!.logo" [alt]="company()!.name" class="h-12 w-auto">
      </div>
      <h2 class="text-3xl font-extrabold text-gray-900 mb-2">
        Aceitar Convite
      </h2>
      <p *ngIf="company()" class="text-sm text-gray-600">
        Você foi convidado para participar da <strong>{{ company()!.name }}</strong>
      </p>
    </div>

    <!-- Loading -->
    <div *ngIf="loading() && !error() && !success()" class="text-center">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
      <p class="mt-2 text-sm text-gray-600">Carregando...</p>
    </div>

    <!-- Error -->
    <div *ngIf="error()" class="bg-red-50 border border-red-200 rounded-md p-4">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-800">{{ error() }}</p>
        </div>
      </div>
      
      <div class="mt-4 text-center">
        <button 
          (click)="goToLogin()"
          class="text-sm text-red-600 hover:text-red-500 underline">
          Ir para Login
        </button>
      </div>
    </div>

    <!-- Success -->
    <div *ngIf="success()" class="bg-green-50 border border-green-200 rounded-md p-4">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-green-800">
            Convite aceito com sucesso! Redirecionando para o dashboard...
          </p>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div *ngIf="!loading() && !error() && !success() && company()" class="mt-8 space-y-6">
      <!-- Google Sign-in -->
      <button
        type="button"
        (click)="acceptInviteWithGoogle()"
        [disabled]="loading()"
        class="w-full flex items-center justify-center gap-3 py-2 px-4 border border-gray-300 rounded-md shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A10.99 10.99 0 0 0 12 23z" fill="#34A853"/>
          <path d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18A10.99 10.99 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.83z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z" fill="#EA4335"/>
        </svg>
        Aceitar entrando com Google
      </button>

      <!-- Separador -->
      <div class="relative">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-gray-50 text-gray-500">ou criar conta com senha</span>
        </div>
      </div>

      <form (ngSubmit)="acceptInvite()" class="space-y-6">
      <div class="space-y-4">
        <!-- Email (readonly) -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>
          <input 
            type="email" 
            [value]="userEmail()" 
            readonly 
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-50 text-gray-500 cursor-not-allowed focus:outline-none">
        </div>

        <!-- Nome -->
        <div>
          <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1">
            Nome completo
          </label>
          <input 
            id="displayName"
            name="displayName"
            type="text" 
            [ngModel]="displayName()" 
            (ngModelChange)="displayName.set($event)"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Senha -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Senha
          </label>
          <input 
            id="password"
            name="password"
            type="password" 
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)"
            required
            minlength="6"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <p class="mt-1 text-sm text-gray-500">Mínimo de 6 caracteres</p>
        </div>

        <!-- Confirmar Senha -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">
            Confirmar senha
          </label>
          <input 
            id="confirmPassword"
            name="confirmPassword"
            type="password" 
            [ngModel]="confirmPassword()" 
            (ngModelChange)="confirmPassword.set($event)"
            required
            minlength="6"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button 
          type="submit" 
          [disabled]="loading()"
          [style.background-color]="getPrimaryColor()"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
          
          <span *ngIf="loading()" class="absolute left-0 inset-y-0 flex items-center pl-3">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
          </span>
          
          {{ loading() ? 'Criando conta...' : 'Aceitar convite e criar conta' }}
        </button>
      </div>

      <!-- Login Link -->
      <div class="text-center">
        <p class="text-sm text-gray-600">
          Já possui uma conta? 
          <button 
            type="button"
            (click)="goToLogin()"
            class="font-medium text-blue-600 hover:text-blue-500">
            Fazer login
          </button>
        </p>
      </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-3">
  <div class="text-center">
    <p class="text-xs text-gray-500">
      Powered by <strong class="text-gray-700">TaskBoard</strong> - Sistema de Gestão Kanban
    </p>
  </div>
</div>
